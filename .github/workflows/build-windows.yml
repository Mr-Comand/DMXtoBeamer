name: Build on Windows

on:
  push:
    branches:
      - go-rewrite

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.23"
      
      - name: Make build script executable
        working-directory: server
        run: chmod +x build.sh

      - name: Build Server
        working-directory: server
        run: sh build.sh

      - name: Build Server for Windows
        working-directory: server
        run: GOOS=windows GOARCH=amd64 go build -tags production -o build/server.exe main.go

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: |
            server/build/server.exe
            server/build/server.zip

  build-client:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.23"

      - name: Download PortAudio header and DLL
        shell: pwsh
        run: |
          $resDir = "client/resources"
          if (-Not (Test-Path $resDir)) { New-Item -ItemType Directory -Path $resDir -Force }
          # Download portaudio.h
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/PortAudio/portaudio/refs/heads/master/include/portaudio.h" -OutFile "$resDir/portaudio.h"
          # Download prebuilt libportaudio.dll (replace URL with your hosted DLL)
          Invoke-WebRequest -Uri "https://example.com/libportaudio.dll" -OutFile "$resDir/libportaudio.dll"

      - name: Patch portaudio wrapper to skip pkg-config
        shell: bash
        run: |
          PORTAUDIO_MOD=$(go env GOPATH)/pkg/mod/github.com/gordonklaus/portaudio@*
          for d in $PORTAUDIO_MOD; do
            if [ -f "$d/portaudio.go" ]; then
              echo "Patching $d/portaudio.go"
              sed -i 's|#cgo pkg-config: portaudio-2.0|#cgo CFLAGS: -I$PWD/client/resources\n#cgo LDFLAGS: -L$PWD/client/resources -lportaudio|' "$d/portaudio.go"
            fi
          done

      - name: Make build script executable
        working-directory: client
        run: chmod +x build.sh

      - name: Build Client
        working-directory: client
        shell: bash
        run: |
          sh build.sh

      - name: Upload client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client
          path: |
            client/build/client.exe
            client/build/client.zip
