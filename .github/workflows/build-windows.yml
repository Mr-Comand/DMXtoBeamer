name: Build on Windows

on:
  push:
    branches:
      - main
      - linux
      - ndi
      - linux-iso
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      build_client:
        description: "Build client"
        required: true
        type: boolean
        default: true

      build_server:
        description: "Build server"
        required: true
        type: boolean
        default: false

      target_os:
        description: "OS to build for"
        required: true
        type: choice
        default: both
        options:
          - windows
          - linux
          - both

      build_iso:
        description: "Create live ISO"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-server:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.build_server && (inputs.target_os == 'windows' || inputs.target_os == 'both')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.23"

      - name: Make build script executable
        working-directory: server
        run: chmod +x build.sh

      - name: Build Server
        working-directory: server
        run: sh build.sh

      - name: Build Server for Windows
        working-directory: server
        run: GOOS=windows GOARCH=amd64 go build -tags production -o build/server.exe main.go

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: |
            server/build/server.exe
            server/build/server.zip

  build-client:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.build_client && (inputs.target_os == 'windows' || inputs.target_os == 'both')) }}
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.23"

      - name: Download PortAudio header and DLL
        shell: pwsh
        run: |
          $resDir = "client/resources"
          if (-Not (Test-Path $resDir)) { New-Item -ItemType Directory -Path $resDir -Force }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/PortAudio/portaudio/refs/heads/master/include/portaudio.h" -OutFile "$resDir/portaudio.h"

      - name: Install zip
        run: choco install zip

      - name: Make build script executable
        working-directory: client
        run: chmod +x build.sh

      - name: Build Client
        working-directory: client
        shell: bash
        run: sh build.sh

      - name: Upload client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client
          path: |
            client/build/client.exe
            client/build/client.zip

  build-server-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.build_server && (inputs.target_os == 'linux' || inputs.target_os == 'both')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.23"

      - name: Build Server for Linux
        working-directory: server
        run: |
          mkdir -p build/server
          cp -r web/webdata build/server/web
          go build -tags production -o build/server/server main.go

      - name: Create zip archive
        working-directory: server/build
        run: zip -r server-linux.zip server

      - name: Upload Linux server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: server/build/server-linux.zip

  build-client-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.build_client && (inputs.target_os == 'linux' || inputs.target_os == 'both')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.23"

      - name: Install X11, Wayland and audio development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            portaudio19-dev libasound2-dev \
            libx11-dev libxkbcommon-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libgl-dev libglu1-mesa-dev \
            wayland-protocols libwayland-dev zip

      - name: Make build script executable
        working-directory: client
        run: chmod +x build-linux.sh

      - name: Build Client for Linux
        working-directory: client
        run: ./build-linux.sh native

      - name: Create zip archive
        working-directory: client/build
        run: zip -r client-linux.zip client shaders

      - name: Upload Linux client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-linux
          path: client/build/client-linux.zip

  # Built natively on the free arm64 hosted runner.
  build-client-linux-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.build_client && (inputs.target_os == 'linux' || inputs.target_os == 'both')) }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.23"

      - name: Install X11 and audio development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            portaudio19-dev libasound2-dev \
            libx11-dev libxkbcommon-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libgl-dev libglu1-mesa-dev zip

      - name: Make build script executable
        working-directory: client
        run: chmod +x build-linux.sh

      - name: Build Client for Raspberry Pi 64-bit
        working-directory: client
        run: ./build-linux.sh native

      - name: Create zip archive
        working-directory: client/build
        run: zip -r client-linux-arm64.zip client shaders

      - name: Upload Pi arm64 client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-linux-arm64
          path: client/build/client-linux-arm64.zip

  build-iso:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_iso }}
    runs-on: ubuntu-latest
    container:
      image: debian:12
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.23"

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ make pkg-config \
            libasound2-dev portaudio19-dev \
            libusb-1.0-0-dev libudev-dev \
            libx11-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libxi-dev libxext-dev libxfixes-dev \
            libxxf86vm-dev libxkbcommon-dev libgl-dev \
            live-build debootstrap squashfs-tools xorriso dosfstools parted rsync \
            git ca-certificates curl file binutils

      - name: Make ISO build script executable
        working-directory: client/DMXtoBeamer-ISO
        run: chmod +x build-iso.sh

      - name: Build Debian 13 live ISO
        working-directory: client/DMXtoBeamer-ISO
        run: sudo bash build-iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmxtobeamer-iso
          path: client/DMXtoBeamer-ISO/dmxtobeamer-live.iso
          if-no-files-found: error

  release:
    needs:
      - build-server
      - build-client
      - build-server-linux
      - build-client-linux
      - build-client-linux-arm64
      - build-iso
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/server/server.zip
            artifacts/client/client.zip
            artifacts/server-linux/server-linux.zip
            artifacts/client-linux/client-linux.zip
            artifacts/client-linux-arm64/client-linux-arm64.zip
            artifacts/dmxtobeamer-iso/dmxtobeamer-live.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}