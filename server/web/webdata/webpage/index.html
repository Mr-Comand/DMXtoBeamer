<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Configurator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin-bottom: 5px; }
        input, button { margin-bottom: 15px; padding: 5px; }
    </style>
</head>
<body>

    <h1>Configure Animation Settings</h1>

    <label for="dimmer">Dimmer:</label>
    <input type="number" id="dimmer" value="50">

    <label for="hueshift">Hue Shift:</label>
    <input type="number" id="hueshift" value="0">

    <label for="rotate">Rotate:</label>
    <input type="number" id="rotate" value="30">
    <label for="scale">scale:</label>
    <input type="number" id="scale" value="25">
    <h2>Layers</h2>
    <label for="animationID">Animation ID:</label>
    <input type="text" id="animationID" value="wave">

    <label for="parameterName">Parameter Name:</label>
    <input type="text" id="parameterName" value="fx1">

    <label for="enabled">Enabled:</label>
    <select id="enabled">
        <option value="true">True</option>
        <option value="false">False</option>
    </select>

    <h2>Target Client</h2>
    <label for="clientID">Target Client ID (Leave blank for broadcast):</label>
    <input type="text" id="clientID" placeholder="Enter Client ID (optional)">

    <button id="sendConfig">Send Config to Go Client</button>

    <script>
        // Send configuration data to the server via REST API (POST request)
        document.getElementById("sendConfig").addEventListener("click", function() {
            const layers = [{
                animationID: document.getElementById("animationID").value,
                parameterName: document.getElementById("parameterName").value,
                enabled: document.getElementById("enabled").value === "true",
                scale: parseInt(document.getElementById("scale").value),
            }];

            const config = {
                
                layers: layers,
                dimmer: parseInt(document.getElementById("dimmer").value),
                hueshift: parseInt(document.getElementById("hueshift").value),
                rotate: parseInt(document.getElementById("rotate").value),
                scale: parseInt(document.getElementById("scale").value),
            };
            clientIDvalue = document.getElementById("clientID").value || "",
            fetch("/api/client/set/"+clientIDvalue, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(config),
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                alert("Configuration updated successfully: " + JSON.stringify(data));
            })
            .catch(error => {
                alert("Error updating configuration: " + error.message);
            });
        });
    </script>

</body>
</html>
